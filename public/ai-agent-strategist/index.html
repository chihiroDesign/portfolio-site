<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f6b">
<title>一問一答アプリ｜操作デモ</title>
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf9; --ink:#23211d; --muted:#6f6a60;
  --accent:#1f6f6b; --accent2:#c2562f; --ok:#2e7d32; --ng:#c62828;
  --line:#e4ddd0; --shadow:0 1px 3px rgba(0,0,0,.07); --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181a; --paper:#1f2225; --ink:#e9e6df; --muted:#a39f96;
    --accent:#5bc6bf; --accent2:#f0915f; --ok:#81c784; --ng:#ef9a9a;
    --line:#33373b; --shadow:0 1px 3px rgba(0,0,0,.4);}
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-size:var(--fs); line-height:1.85; padding-bottom:40px;}
header.top{position:sticky; top:0; z-index:50; background:var(--accent); color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; box-shadow:var(--shadow);}
header.top h1{font-size:1rem; margin:0; font-weight:700}
header.top .stat{font-size:.78rem; opacity:.9; margin-top:2px}
main{max-width:680px; margin:0 auto; padding:14px}
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px;
  padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
.menu-btn{display:block; width:100%; text-align:left; background:var(--paper); color:var(--ink);
  border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px;
  font-size:1rem; font-weight:700; box-shadow:var(--shadow); -webkit-appearance:none;}
.menu-btn small{display:block; font-weight:400; color:var(--muted); font-size:.8rem; margin-top:2px}
.menu-btn.primary{background:var(--accent); color:#fff; border:0}
.menu-btn.primary small{color:rgba(255,255,255,.85)}
.qmeta{font-size:.75rem; color:var(--muted); margin-bottom:6px}
.qtext{font-weight:700; margin-bottom:14px; line-height:1.8}
.choice{display:block; width:100%; text-align:left; background:var(--bg); color:var(--ink);
  border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:9px;
  font-size:.95rem; line-height:1.7; -webkit-appearance:none;}
.choice b{color:var(--accent); margin-right:6px}
.choice.correct{border-color:var(--ok); background:rgba(46,125,50,.1)}
.choice.wrong{border-color:var(--ng); background:rgba(198,40,40,.1)}
.choice:disabled{opacity:1; color:var(--ink)}
.verdict{font-size:1.05rem; font-weight:700; margin:10px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.explain{background:var(--bg); border-left:4px solid var(--accent); border-radius:0 8px 8px 0;
  padding:10px 14px; font-size:.92rem; margin-top:8px}
.nav{display:flex; gap:10px; margin-top:14px}
.nav button{flex:1; background:var(--accent); color:#fff; border:0; border-radius:12px;
  padding:13px; font-size:1rem; font-weight:700; -webkit-appearance:none;}
.nav button.ghost{background:var(--paper); color:var(--ink); border:1px solid var(--line)}
.prog{height:6px; background:var(--line); border-radius:3px; margin:4px 0 14px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--accent); transition:width .25s}
.result-big{font-size:2rem; font-weight:800; text-align:center; margin:10px 0}
.result-sub{text-align:center; color:var(--muted); margin-bottom:14px}
.hidden{display:none}
.wrongtag{display:inline-block; background:var(--accent2); color:#fff; font-size:.68rem;
  border-radius:6px; padding:1px 7px; margin-left:8px; vertical-align:middle}
.portfolio-link{display:inline-block;margin-top:5px;color:rgba(255,255,255,.9);font-size:.78rem;text-underline-offset:3px}
.demo-note{border-left:4px solid var(--accent);font-size:.88rem;line-height:1.7}
button,a{-webkit-tap-highlight-color:transparent}
.menu-btn,.choice,.nav button{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background-color .16s ease}
.menu-btn:hover:not(:disabled),.choice:hover:not(:disabled),.nav button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.menu-btn:active:not(:disabled),.choice:active:not(:disabled),.nav button:active:not(:disabled){transform:scale(.985)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.65}
.screen.is-visible{animation:screen-in .22s cubic-bezier(.2,.75,.25,1) both}
@keyframes screen-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.choice{animation:choice-in .18s ease-out both}
.choice:nth-child(2){animation-delay:.025s}.choice:nth-child(3){animation-delay:.05s}.choice:nth-child(4){animation-delay:.075s}
@keyframes choice-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.storage-alert{background:rgba(198,40,40,.1);border-left:4px solid var(--ng);border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:12px;font-size:.85rem}
#storage-status.storage-warning{color:var(--ng);font-weight:700}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}</style>
</head>
<body>
<header class="top">
  <h1>一問一答アプリ｜操作デモ</h1>
  <div class="stat" id="topstat">タップで解く → 即答え合わせ</div><a class="portfolio-link" href="/works/ai-agent-strategist">制作実績を見る</a>
</header>
<main><div class="card demo-note"><strong>オリジナルの操作サンプル</strong><br>架空の「星空喫茶」を題材にした問題で、章別出題・シャッフル・解答・解説・誤答復習をお試しいただけます。</div>
  <div id="menu" class="screen">
    <div class="card" id="resume-card" style="display:none">
      <button class="menu-btn primary" id="resume-btn">▶ 前回の続きから</button>
    </div>
    <button class="menu-btn primary" id="start-all">全問シャッフルで解く<small>ダミー問題6問をランダム順で</small></button>
    <button class="menu-btn" id="start-wrong">間違えた問題だけ<small id="wrongcount">まだ記録なし</small></button>
    <div class="card">
      <div style="font-size:.8rem; color:var(--muted); font-weight:700; margin-bottom:8px">章をしぼって解く</div>
      <div id="chapbtns"></div>
    </div>
    <div class="card" style="font-size:.8rem; color:var(--muted)">
      <span id="storage-status" role="status" aria-live="polite">成績と途中経過をこのブラウザーに保存します。</span><br>シャッフルや章別モードで解き、間違えた問題を復習できます。
      <div style="margin-top:6px"><button class="menu-btn" id="reset-btn" style="margin:0; font-size:.85rem; padding:9px 14px">成績をリセット</button></div>
    </div>
  </div>

  <div id="quiz" class="screen hidden">
    <div class="prog"><i id="bar"></i></div><div id="storage-alert" class="storage-alert hidden" role="status" aria-live="polite">成績を保存できません。この画面を閉じると進捗が失われます。</div>
    <div class="card">
      <div class="qmeta" id="qmeta" aria-live="polite"></div>
      <div class="qtext" id="qtext" aria-live="polite"></div>
      <div id="choices"></div>
      <div id="feedback" class="hidden" role="status" aria-live="polite">
        <div class="verdict" id="verdict"></div>
        <div class="explain" id="explain"></div>
      </div>
      <div class="nav">
        <button class="ghost" id="quit">メニューへ</button>
        <button id="next" disabled>答えを選んでください</button>
      </div>
    </div>
  </div>

  <div id="result" class="screen hidden">
    <div class="card">
      <div class="result-big" id="score"></div>
      <div class="result-sub" id="scoresub"></div>
      <div class="nav">
        <button class="ghost" id="back-menu">メニューへ</button>
        <button id="retry-wrong">間違いだけもう一度</button>
      </div>
    </div>
  </div>
</main>
<script>
var QUESTIONS = [{"section":"星空喫茶のメニュー","q":"このデモの設定で、看板ドリンク「月灯りソーダ」に浮かべる飾りはどれですか。","choices":{"A":"星形の砂糖菓子","B":"木の葉","C":"赤いボタン","D":"小さな貝殻"},"answer":"A","explain":"星空喫茶の看板ドリンクには、星形の砂糖菓子を浮かべる設定です。","ch":1,"chname":"第1章 星空喫茶のメニュー"},{"section":"星空喫茶のメニュー","q":"このデモの季節メニューで、春限定として登場する飲み物はどれですか。","choices":{"A":"流星レモネード","B":"さくらミルクティー","C":"雲のココア","D":"月影コーヒー"},"answer":"B","explain":"春限定メニューは、桜の花びらを添えた「さくらミルクティー」という設定です。","ch":1,"chname":"第1章 星空喫茶のメニュー"},{"section":"お店のしるし","q":"星空喫茶の入口にある紫色の看板は、何を知らせる合図ですか。","choices":{"A":"本日休業","B":"貸し切り","C":"夜の営業中","D":"新メニュー準備中"},"answer":"C","explain":"この架空のお店では、紫色の看板が夜の営業中を知らせます。","ch":2,"chname":"第2章 お店のしるし"},{"section":"お店のしるし","q":"このデモの設定で、窓辺の席を見つける目印はどれですか。","choices":{"A":"緑色の風車","B":"小さな星のランプ","C":"白い傘","D":"金色のベル"},"answer":"B","explain":"窓辺の席には、小さな星の形をしたランプが置かれています。","ch":2,"chname":"第2章 お店のしるし"},{"section":"喫茶店の小さな物語","q":"星空喫茶では、閉店前にどんな合図を流す設定ですか。","choices":{"A":"三音のベル","B":"汽車の汽笛","C":"波の音","D":"ピアノの長い曲"},"answer":"A","explain":"このデモでは、閉店前に三音のベルを鳴らすことになっています。","ch":3,"chname":"第3章 喫茶店の小さな物語"},{"section":"喫茶店の小さな物語","q":"雨の日にだけ星空喫茶へ手紙を届けるフクロウの名前はどれですか。","choices":{"A":"ルナ","B":"ポポ","C":"ミント","D":"ソラ"},"answer":"B","explain":"雨の日の手紙配達を担当するフクロウは「ポポ」という設定です。","ch":3,"chname":"第3章 喫茶店の小さな物語"}];
var CHAPTERS = [{"id":1,"name":"第1章 星空喫茶のメニュー","count":2},{"id":2,"name":"第2章 お店のしるし","count":2},{"id":3,"name":"第3章 喫茶店の小さな物語","count":2}];
(function(){
  var $=function(id){return document.getElementById(id)};
  var STORAGE={stats:'aast_demo_stats_v1',session:'aast_demo_session_v1'};
  var storageAvailable=true;
  function getStored(key){try{return localStorage.getItem(key)}catch(e){storageAvailable=false;return null}}
  function setStored(key,value){try{localStorage.setItem(key,value);return true}catch(e){storageAvailable=false;updateStorageStatus();return false}}
  function removeStored(key){try{localStorage.removeItem(key);return true}catch(e){storageAvailable=false;updateStorageStatus();return false}}
  var stats={};
  try{stats=JSON.parse(getStored(STORAGE.stats)||'{}')||{}}catch(e){stats={};storageAvailable=false}
  function updateStorageStatus(){
    var status=$('storage-status'); var alert=$('storage-alert');
    if(status){status.textContent=storageAvailable?'成績と途中経過をこのブラウザーに保存します。':'このブラウザーでは保存できません。プライベートモード設定などをご確認ください。';status.className=storageAvailable?'':'storage-warning'}
    if(alert){alert.classList.toggle('hidden',storageAvailable);if(!storageAvailable)alert.textContent='成績をこのブラウザーに保存できません。今の画面では続けられますが、閉じると進捗が失われます。'}
  }
  var session = null;

  function save(){ setStored(STORAGE.stats,JSON.stringify(stats)); updateStorageStatus(); }
  function saveSession(){ if(session) setStored(STORAGE.session,JSON.stringify(session)); else removeStored(STORAGE.session); updateStorageStatus(); }
  function wrongIdxs(){ var a=[]; for(var k in stats){ if(stats[k].lastWrong) a.push(parseInt(k,10)); } return a; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  function updateMenu(){
    var w=wrongIdxs().length;
    $('wrongcount').textContent = w ? w+'問たまっています' : 'まだ記録なし';
    $('start-wrong').disabled = !w;
    var ss = getStored(STORAGE.session);
    $('resume-card').style.display = ss ? '' : 'none';
    var answered=0; for(var k in stats) answered++;
    $('topstat').textContent = answered ? ('進捗：'+answered+'/'+QUESTIONS.length+'問に挑戦済み') : 'タップで解く → 即答え合わせ';
  }

  // chapter buttons
  CHAPTERS.forEach(function(c){
    var b=document.createElement('button');
    b.className='menu-btn'; b.style.marginBottom='8px';
    b.innerHTML=c.name+'<small>'+c.count+'問</small>';
    b.onclick=function(){ start(QUESTIONS.map(function(q,i){return q.ch===c.id?i:-1}).filter(function(i){return i>=0}), true); };
    $('chapbtns').appendChild(b);
  });

  function start(idxs, doShuffle){
    if(!idxs.length) return;
    session = { order: doShuffle? shuffle(idxs.slice()) : idxs.slice(), pos:0, ok:0, ng:0, wrongThis:[] };
    saveSession();
    show('quiz'); render();
  }
  function resume(){
    var ss=getStored(STORAGE.session); if(!ss) return;
    try{session=JSON.parse(ss);if(!session||!Array.isArray(session.order)||session.order.some(function(i){return i<0||i>=QUESTIONS.length}))throw new Error('invalid session')}
    catch(e){session=null;removeStored(STORAGE.session);$('storage-status').textContent='途中データを読み込めませんでした。新しく始めてください。';return}
    show('quiz');render();
  }
  function show(id){
    ['menu','quiz','result'].forEach(function(x){$(x).classList.add('hidden');$(x).classList.remove('is-visible')});
    var panel=$(id);panel.classList.remove('hidden');window.requestAnimationFrame(function(){panel.classList.add('is-visible')});
    if(id==='menu')updateMenu();window.scrollTo(0,0);
  }
  function render(){
    var i=session.order[session.pos];
    var q=QUESTIONS[i];
    $('bar').style.width=Math.round(session.pos/session.order.length*100)+'%';
    var wrongMark = stats[i]&&stats[i].lastWrong ? '<span class="wrongtag">前回×</span>' : '';
    $('qmeta').innerHTML='Q'+(session.pos+1)+' / '+session.order.length+'　'+q.chname+'｜'+q.section+wrongMark;
    $('qtext').textContent=q.q;
    var box=$('choices'); box.innerHTML='';
    Object.keys(q.choices).forEach(function(k){
      var b=document.createElement('button');
      b.className='choice'; b.innerHTML='<b>'+k+'</b>'+q.choices[k];
      b.onclick=function(){ answer(k, b); };
      box.appendChild(b);
    });
    $('feedback').classList.add('hidden');
    $('next').disabled=true; $('next').textContent='答えを選んでください';
  }
  function answer(k, btn){
    var i=session.order[session.pos];
    var q=QUESTIONS[i];
    var correct = (k===q.answer);
    [].slice.call($('choices').children).forEach(function(b){
      b.disabled=true;
      var key=b.querySelector('b').textContent;
      if(key===q.answer) b.classList.add('correct');
      else if(b===btn && !correct) b.classList.add('wrong');
    });
    if(!stats[i]) stats[i]={ok:0,ng:0,lastWrong:false};
    if(correct){ stats[i].ok++; stats[i].lastWrong=false; session.ok++; }
    else{ stats[i].ng++; stats[i].lastWrong=true; session.ng++; session.wrongThis.push(i); }
    save();
    $('verdict').textContent = correct ? '◯ 正解！' : '× 不正解（正解：'+q.answer+'）';
    $('verdict').className = 'verdict '+(correct?'ok':'ng');
    $('explain').textContent = q.explain;
    $('feedback').classList.remove('hidden');
    $('next').disabled=false;
    $('next').textContent = (session.pos+1>=session.order.length)?'結果を見る':'次の問題 →';
    saveSession();
  }
  $('next').onclick=function(){
    session.pos++;
    if(session.pos>=session.order.length){ finish(); }
    else { saveSession(); render(); }
  };
  function finish(){
    $('score').textContent = session.ok+' / '+session.order.length+' 正解';
    var pct=Math.round(session.ok/session.order.length*100);
    $('scoresub').textContent = pct+'%　'+(pct>=90?'仕上がってます！':pct>=70?'あと少し。×だけ回そう':'間違えた問題をもう一度解こう');
    $('retry-wrong').style.display = session.wrongThis.length? '':'none';
    session=null; saveSession();
    show('result');
  }
  $('quit').onclick=function(){ saveSession(); show('menu'); };
  $('back-menu').onclick=function(){ show('menu'); };
  $('retry-wrong').onclick=function(){ start(wrongIdxs(), true); };
  $('start-all').onclick=function(){ start(QUESTIONS.map(function(_,i){return i}), true); };
  $('start-wrong').onclick=function(){ start(wrongIdxs(), true); };
  $('resume-btn').onclick=resume;
  $('reset-btn').onclick=function(){
    if(confirm('成績記録をすべて消します。よろしいですか？')){ stats={}; save(); session=null; saveSession(); updateMenu(); }
  };
  updateMenu();
  updateStorageStatus();
})();
</script>
</body>
</html>
