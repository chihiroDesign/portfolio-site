<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">問題集から一問一答アプリを制作</title>
<desc id="desc">学習アプリの章別出題、解答、解説、誤答復習の画面イメージ</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2a"/><stop offset="1" stop-color="#1b2b3c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4dd3bb"/><stop offset="1" stop-color="#20a98c"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020812" flood-opacity=".42"/></filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#8fb4c8" opacity=".18"/></pattern>
</defs>
<rect width="1280" height="720" rx="32" fill="url(#bg)"/>
<rect width="750" height="720" rx="32" fill="url(#dots)"/>
<circle cx="570" cy="90" r="245" fill="#27a88f" opacity=".07"/>
<circle cx="660" cy="650" r="240" fill="#5d7cd4" opacity=".08"/>
<rect x="68" y="72" width="430" height="42" rx="21" fill="#1c3442" stroke="#315466"/>
<circle cx="91" cy="93" r="6" fill="#4dd3bb"/>
<text x="111" y="100" fill="#b8d5dd" font-family="sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">オリジナル学習アプリ｜操作デモ</text>
<text x="68" y="222" fill="#ffffff" font-family="sans-serif" font-size="68" font-weight="800" letter-spacing="1">問題集から</text>
<text x="68" y="302" fill="#ffffff" font-family="sans-serif" font-size="54" font-weight="800" letter-spacing=".5">一問一答アプリを制作</text>
<text x="72" y="358" fill="#a9bdcc" font-family="sans-serif" font-size="24">学習の流れを設計し、アプリとして実装</text>
<g font-family="sans-serif" font-size="19" font-weight="700">
  <rect x="70" y="410" width="146" height="52" rx="15" fill="#1b3440" stroke="#335465"/><text x="95" y="443" fill="#d5f2ec">章別出題</text>
  <rect x="230" y="410" width="164" height="52" rx="15" fill="#1b3440" stroke="#335465"/><text x="251" y="443" fill="#d5f2ec">全問シャッフル</text>
  <rect x="408" y="410" width="148" height="52" rx="15" fill="#1b3440" stroke="#335465"/><text x="431" y="443" fill="#d5f2ec">誤答復習</text>
</g>
<path d="M72 535H682" stroke="#365060" stroke-width="2"/>
<g font-family="sans-serif">
  <circle cx="88" cy="535" r="13" fill="url(#accent)"/><text x="84" y="541" fill="#07342f" font-size="14" font-weight="800">1</text>
  <text x="112" y="541" fill="#d7e3e8" font-size="18" font-weight="700">問題を選ぶ</text>
  <circle cx="257" cy="535" r="13" fill="url(#accent)"/><text x="253" y="541" fill="#07342f" font-size="14" font-weight="800">2</text>
  <text x="281" y="541" fill="#d7e3e8" font-size="18" font-weight="700">解答する</text>
  <circle cx="420" cy="535" r="13" fill="url(#accent)"/><text x="416" y="541" fill="#07342f" font-size="14" font-weight="800">3</text>
  <text x="444" y="541" fill="#d7e3e8" font-size="18" font-weight="700">解説・復習</text>
</g>
<text x="72" y="633" fill="#728b9c" font-family="sans-serif" font-size="16" letter-spacing="1">UI DESIGN  /  INTERACTIVE DEMO</text>
<!-- Mobile quiz screen -->
<g filter="url(#shadow)">
  <rect x="790" y="38" width="420" height="644" rx="42" fill="#080e17" stroke="#617487" stroke-width="2"/>
  <rect x="804" y="52" width="392" height="616" rx="31" fill="#f6f4ef"/>
  <rect x="934" y="61" width="132" height="18" rx="9" fill="#080e17"/>
  <rect x="804" y="94" width="392" height="77" rx="0" fill="#1f6f6b"/>
  <text x="832" y="126" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="800">星空喫茶</text>
  <text x="832" y="151" fill="#d6f1ed" font-family="sans-serif" font-size="14">一問一答｜操作デモ</text>
  <circle cx="1154" cy="132" r="20" fill="#ffffff" opacity=".15"/>
  <path d="M1157 117a15 15 0 1 0 12 24 12 12 0 0 1-12-24Z" fill="#fbe89a"/>
  <text x="832" y="202" fill="#6f6a60" font-family="sans-serif" font-size="14" font-weight="700">第1章　星空喫茶のメニュー</text>
  <rect x="832" y="217" width="336" height="7" rx="3.5" fill="#dfd9ce"/>
  <rect x="832" y="217" width="74" height="7" rx="3.5" fill="#1f6f6b"/>
  <text x="1130" y="246" fill="#777166" font-family="sans-serif" font-size="13">1 / 6</text>
  <rect x="828" y="264" width="344" height="154" rx="19" fill="#fffdf9" stroke="#e4ddd0" stroke-width="2"/>
  <text x="850" y="293" fill="#7a756a" font-family="sans-serif" font-size="13" font-weight="700">メニューのクイズ</text>
  <text x="850" y="332" fill="#23211d" font-family="sans-serif" font-size="20" font-weight="800">看板ドリンク「月灯りソーダ」に</text>
  <text x="850" y="361" fill="#23211d" font-family="sans-serif" font-size="20" font-weight="800">浮かべる飾りはどれ？</text>
  <rect x="832" y="434" width="336" height="48" rx="13" fill="#e3f3ed" stroke="#2e8b69" stroke-width="2"/>
  <circle cx="858" cy="458" r="12" fill="#2e8b69"/>
  <path d="m852 458 4 4 8-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="881" y="464" fill="#245b49" font-family="sans-serif" font-size="16" font-weight="700">星形の砂糖菓子</text>
  <rect x="832" y="490" width="336" height="44" rx="13" fill="#fffdf9" stroke="#e4ddd0"/>
  <text x="855" y="518" fill="#514d45" font-family="sans-serif" font-size="16">木の葉</text>
  <rect x="832" y="542" width="336" height="44" rx="13" fill="#fffdf9" stroke="#e4ddd0"/>
  <text x="855" y="570" fill="#514d45" font-family="sans-serif" font-size="16">小さな貝殻</text>
  <rect x="832" y="599" width="336" height="48" rx="13" fill="#1f6f6b"/>
  <text x="933" y="629" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">正解を確認</text>
</g>
</svg>
